name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels the run still in flight for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Never let a cgo-linked artifact reach a release (ADR-0002).
  CGO_ENABLED: "0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: make vet

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  test:
    name: Unit and golden tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: make test

      # The race detector needs cgo. This is a test-time tool, not a shipped
      # artifact, so it does not conflict with the CGO_ENABLED=0 rule. It is how
      # RISKS T8 (threads migrating between network namespaces) gets caught.
      - name: Test with the race detector
        run: make test-race

  generated:
    name: Generated code is current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check generated code
        run: make generate-check

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  cross:
    name: Cross-build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # nephosd and nephos-hook run inside the appliance and are Linux-only;
      # the CLI is built for all six targets.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          go build -trimpath -o /dev/null ./cmd/nephos
          if [ "$GOOS" = "linux" ]; then
            go build -trimpath -o /dev/null ./cmd/nephosd
            go build -trimpath -o /dev/null ./cmd/nephos-hook
          fi

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # RISKS S7 (supply chain).
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  appliance-smoke:
    name: Appliance bootstrap (native Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build local development AMI
        run: make dev-ami

      - name: Build local appliance and CLI
        run: |
          make appliance
          make build

      - name: Check isolated appliance startup
        run: bash tests/appliance-smoke.sh

      - name: Check CLI bootstrap and restart
        run: bash tests/appliance-cli-smoke.sh

      - name: Appliance logs on failure
        if: failure()
        run: docker logs nephos || true

      - name: Remove only Nephos-owned test objects
        if: always()
        run: |
          if [ "$(docker inspect -f '{{index .Config.Labels "io.nephos.appliance"}}' nephos 2>/dev/null || true)" = true ]; then
            docker rm -f nephos
          fi
          if [ "$(docker volume inspect -f '{{index .Labels "io.nephos.appliance"}}' nephos-data 2>/dev/null || true)" = true ]; then
            docker volume rm nephos-data
          fi
