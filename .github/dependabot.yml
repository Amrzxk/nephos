# RISKS S7 (supply chain): surface dependency, action and base-image updates
# as reviewable pull requests instead of letting them drift silently.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)

  - package-ecosystem: docker
    directories:
      - /images/appliance
      - /images/dev-ami
    schedule:
      interval: weekly
    # Base-image versions are deliberate: the dev AMI is Ubuntu 24.04 LTS,
    # the appliance tracks Debian stable, and the Go builder image must match
    # the go.mod toolchain. Only patch-level and digest updates are proposed;
    # release jumps go through a normal change that updates all of them.
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major, version-update:semver-minor]
    commit-message:
      prefix: chore(deps)
