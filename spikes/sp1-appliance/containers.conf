# Podman defaults for the SP1 spike appliance.

[containers]
# Instances are real machines: default capabilities and the default seccomp
# profile, nothing extra (ADR-0004, RISKS S2). sudo must keep working.
init = false
# Podman-managed networks are never used. Nephos owns the network plane
# (ADR-0005); the hook wires eth0 itself (SP2).
default_sysctls = []

[engine]
runtime = "crun"
cgroup_manager = "cgroupfs"
events_logger = "file"
# The appliance has no systemd of its own, so neither of the systemd-backed
# defaults would work here.

[network]
# No CNI, no netavark-managed bridges: an instance gets its network from Nephos
# or it gets none at all.
default_network = "nephos-none"
