# Podman storage for the SP1 spike appliance.
#
# Everything lives under /var/lib/nephos, which is the mounted volume. Nesting
# an overlay filesystem inside the appliance's own overlay layer does not work,
# which is exactly why ADR-0003 requires a named volume.

[storage]
driver = "overlay"
runroot = "/var/lib/nephos/runroot"
graphroot = "/var/lib/nephos/containers"

[storage.options]
# RISKS T10: without ID-mapped mounts, a per-instance user namespace forces the
# image layers to be copied or chowned, which is what SP1 measures. On a 6.x
# kernel this should be cheap.
mount_program = ""

[storage.options.overlay]
# Needed when the appliance's own filesystem cannot support native overlay.
mountopt = "nodev"
